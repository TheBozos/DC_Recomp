name: Native toolchain
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build the pinned native engine and synthetic fixtures
        run: |
          cmake -S tests/native_lifetime -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci --parallel 2
          ctest --test-dir build/ci --output-on-failure
      - name: Check offline tools and shell commands
        run: |
          python3 -m py_compile tools/dc_bozo_prepare.py tools/dc_bozo_audio.py tools/dc_bozo_externals.py tools/dc_texconv.py tools/gs_layout.py tools/wrap_elf.py tools/symtab_map.py tools/dc_packet_audit.py tools/dc_instrument_indirect.py tests/test_indirect_audit.py tests/make_visibility_fixture.py tests/make_packet_wrapper_fixture.py tests/make_overlay_packet_fixture.py tests/overlay_packet_cases.py tests/make_dun_dispatch_fixture.py
          python3 -m py_compile tools/dc_alias_audit.py tests/test_alias_audit.py
          python3 -m py_compile tools/dc_callee_audit.py tests/test_callee_audit.py
          python3 -m py_compile tools/dc_loadchara_audit.py tools/dc_pack_inventory.py tests/test_loadchara_audit.py
          python3 -m py_compile tools/dc_readinfo_audit.py tests/test_readinfo_audit.py
          python3 -I tests/test_release_tools.py
          python3 -m py_compile tools/make_build_kit.py tools/make_release.py tools/dc_build.py
          python3 -I tests/test_externals.py
          for script in scripts/*.sh; do bash -n "$script"; done
